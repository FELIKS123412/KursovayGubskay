отсчет i</text><text x="350.0" y="405.00" font-family="DejaVu Sans" font-size="15" text-anchor="middle" fill="#000000">для проверки правила</text><polygon fill="#ffffff" stroke="#000000" stroke-width="1.6" points="350.0,469.0 482.0,520.0 350.0,571.0 218.0,520.0" /><text x="350.0" y="515.00" font-family="DejaVu Sans" font-size="15" text-anchor="middle" fill="#000000">Q[i] &gt; Q[i-1] &amp;&amp;</text><text x="350.0" y="535.00" font-family="DejaVu Sans" font-size="15" text-anchor="middle" fill="#000000">Q[i] &gt; Q[i+1]?</text><rect fill="#ffffff" stroke="#000000" stroke-width="1.6" x="38.0" y="616.0" width="184.0" height="48" /><text x="130.0" y="645.00" font-family="DejaVu Sans" font-size="15" text-anchor="middle" fill="#000000">state[i] = АНОМАЛИЯ</text><rect fill="#ffffff" stroke="#000000" stroke-width="1.6" x="494.0" y="616.0" width="152.0" height="48" /><text x="570.0" y="645.00" font-family="DejaVu Sans" font-size="15" text-anchor="middle" fill="#000000">state[i] = НОРМА</text><polygon fill="#ffffff" stroke="#000000" stroke-width="1.6" points="350.0,729.0 512.0,780.0 350.0,831.0 188.0,780.0" /><text x="350.0" y="775.00" font-family="DejaVu Sans" font-size="15" text-anchor="middle" fill="#000000">Число узлов в</text><text x="350.0" y="795.00" font-family="DejaVu Sans" font-size="15" text-anchor="middle" fill="#000000">АНОМАЛИИ &gt;= 2?</text><rect fill="#ffffff" stroke="#000000" stroke-width="1.6" x="22.0" y="867.5" width="216.0" height="85" /><text x="130.0" y="895.00" font-family="DejaVu Sans" font-size="15" text-anchor="middle" fill="#000000">Зафиксировать инцидент:</text><text x="130.0" y="915.00" font-family="DejaVu Sans" font-size="15" text-anchor="middle" fill="#000000">first, second = сбойные</text><text x="130.0" y="935.00" font-family="DejaVu Sans" font-size="15" text-anchor="middle" fill="#000000">узлы</text><polygon fill="#ffffff" stroke="#000000" stroke-width="1.6" points="268.5,1007.5 449.5,1007.5 431.5,1072.5 250.5,1072.5" /><text x="350.0" y="1035.00" font-family="DejaVu Sans" font-size="15" text-anchor="middle" fill="#000000">Вывести таблицы Q,</text><text x="350.0" y="1055.00" font-family="DejaVu Sans" font-size="15" text-anchor="middle" fill="#000000">статусы и инциденты</text><ellipse fill="#ffffff" stroke="#000000" stroke-width="1.6" cx="350.0" cy="1150.0" rx="44.0" ry="24.0" /><text x="350.0" y="1155.00" font-family="DejaVu Sans" font-size="15" text-anchor="middle" fill="#000000">Конец</text></svg>