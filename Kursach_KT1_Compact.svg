  <path d="M 340.0 168.0 L 340.0 196.0" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 340.0 250.0 L 340.0 280.0" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 340.0 368.0 L 340.0 398.0" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 185.0 442.0 L 142.0 442.0 L 142.5 520.0" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="144.0" y="417.0" width="36" height="16" fill="#ffffff"/>
  <text x="162.0" y="429.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">Да</text>
  <path d="M 495.0 442.0 L 537.0 442.0 L 537.5 520.0" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="497.0" y="417.0" width="36" height="16" fill="#ffffff"/>
  <text x="515.0" y="429.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">Нет</text>
  <path d="M 142.5 568.0 L 142.0 588.0 L 340.0 588.0 L 340.0 608.0" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 537.5 568.0 L 537.0 588.0 L 340.0 588.0 L 340.0 608.0" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 340.0 662.0 L 340.0 694.0" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 465.0 731.0 L 655.0 731.0 L 655.0 223.0 L 467.0 223.0" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="487.0" y="706.0" width="36" height="16" fill="#ffffff"/>
  <text x="505.0" y="718.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">Нет</text>
  <path d="M 340.0 768.0 L 340.0 804.0" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="342.0" y="773.0" width="36" height="16" fill="#ffffff"/>
  <text x="360.0" y="785.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">Да</text>
  <rect x="285" y="30" width="110" height="44" rx="22.0" ry="22.0" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="340.0" y="56.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#000000">Начало</text>
  <rect x="195" y="100" width="290" height="68" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="340.0" y="121.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#000000">Установка локали RUS;</text>
  <text x="340.0" y="138.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#000000">поочередный выбор компонента:</text>
  <text x="340.0" y="155.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#000000">DSK, NET, API</text>
  <polygon points="221.0,196.0 475.0,196.0 459.0,250.0 205.0,250.0" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="340.0" y="219.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#000000">Вывод имени компонента,</text>
  <text x="340.0" y="236.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#000000">ввод 5 значений X[1]..X[5]</text>
  <rect x="180" y="280" width="320" height="88" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="340.0" y="303.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#000000">Расчет показателей Q (k = 1):</text>
  <text x="340.0" y="320.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#000000">Q[1] = 0.0; для i = 2..5:</text>
  <text x="340.0" y="337.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#000000">если X[i-1] != 0 -&gt; Q[i] = ln(X[i]/X[i-1])</text>
  <text x="340.0" y="354.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#000000">иначе Q[i] = 0.0</text>
  <polygon points="340.0,398.0 495.0,442.0 340.0,486.0 185.0,442.0" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="340.0" y="429.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#000000">Для i = 2, 3, 4:</text>
  <text x="340.0" y="446.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#000000">Q[i] &gt; Q[i-1] &amp;&amp;</text>
  <text x="340.0" y="463.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#000000">Q[i] &gt; Q[i+1]?</text>
  <rect x="45" y="520" width="195" height="48" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="142.5" y="548.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#000000">Состояние: АНОМАЛИЯ</text>
  <rect x="440" y="520" width="195" height="48" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="537.5" y="548.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#000000">Состояние: НОРМА</text>
  <polygon points="216.0,608.0 480.0,608.0 464.0,662.0 200.0,662.0" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="340.0" y="631.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#000000">Вывод значений Q[2..4]</text>
  <text x="340.0" y="648.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#000000">и состояния компонента</text>
  <polygon points="340.0,694.0 465.0,731.0 340.0,768.0 215.0,731.0" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="340.0" y="727.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#000000">Обработаны все</text>
  <text x="340.0" y="744.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#000000">3 компонента?</text>
  <rect x="285" y="804" width="110" height="44" rx="22.0" ry="22.0" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="340.0" y="830.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#000000">Конец</text>
</svg>
